[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-mcp"
version = "1.0.0"
description = "MCP Server for browser automation — web navigation, form filling, and portal interactions"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastmcp>=2.12.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
browser-mcp = "browser_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["browser_mcp"]
